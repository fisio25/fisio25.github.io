<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Áreas de Brodmann</title>
    <link rel="stylesheet" href="brodman.css">
</head>
<body>
    <div class="game-container">
        <h1>Áreas de Brodmann</h1>
        
        <!-- Imagen de referencia -->
        <div class="image-container">
            <img src="img/brodman.png" alt="Áreas de Brodmann" id="brodmann-image">
        </div>
        
        <!-- Contenedor de la pregunta actual -->
        <div id="question-container">
            <p id="question-text"></p>
            <div id="result-message"></div>
        </div>

        <!-- Opciones para que el usuario seleccione el color -->
        <div class="options-container" id="options-container"></div>

        <!-- Mensaje cuando se termina -->
        <div id="final-message"></div>

        <div class="buttons-container">
            <a href="index.html"><button>Menu principal</button></a>
          </div>
      
    </div>

    <script src="brodman.js"></script>
</body>
</html>
