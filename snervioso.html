<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema nervioso central</title>
    <link rel="stylesheet" href="snervioso.css">
</head>
<body>
    <div class="game-container">
        <div class="image-container">
            <img src="img/Sistema nervioso.jpg" alt="Pista para adivinar la palabra" id="game-image" height="35%" width="35%">
        </div>
        <div class="hint-container">
            <p id="hint">Pista: </p>
        </div>
        <div class="word-container" id="word-container">
            <!-- Los recuadros se llenarán con JavaScript según la palabra -->
        </div>
        <div class="input-container">
            <input type="text" id="letter-input" maxlength="1" placeholder="Escribe una letra">
            <button id="submit-letter">Enviar Letra</button>
        </div>
        <div class="message" id="message"></div>
        <div class="next-container" id="next-container">
            <button id="next-level" style="display:none;">Siguiente Imagen</button>
        </div>

        <div class="buttons-container">
            <a href="index.html"><button>Menu principal</button></a>
          </div>
    
    </div>
    <script src="snervioso.js"></script>
</body>
</html>
