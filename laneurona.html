<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="laneurona.css">
    <title>La neurona</title>
</head>
<body>
    <h1>La neurona</h1>
       <!-- Contenido principal: botones y imagen -->
       <div class="container-custom">
        <div class="buttons-group">
            <div class="buttons-column">
                <button class="morado" data-info="Contiene la información genética que dirige la actividad de la neurona. Está ubicado dentro del soma o cuerpo celular de la neurona y es donde se encuentra el material genético en forma de cromosomas.">Núcleo</button>
                <button class="morado2" data-info="Es una estructura densa y esférica que se encuentra dentro del núcleo de las células eucariotas. Su función principal es la síntesis de las subunidades ribosómicas, que son esenciales para la fabricación de proteínas en las células.">Nucleolo</button>
                <button class="verde" data-info="Los cuerpos de Nissl son cúmulos de retículo endoplasmático rugoso y ribosomas, y su función principal es la síntesis de proteínas necesarias para el crecimiento y la regeneración neuronal.">Cuerpo de Nissi</button>
                <button class="verde" data-info="Es la parte central y principal de la neurona. Contiene el núcleo de la célula, donde se encuentran las instrucciones genéticas presentes en el ADN, y es responsable de producir y mantener el nivel de energía suficiente para que la célula pueda seguir funcionando.">Cuerpo neuronal</button>
                <button class="rojo" data-info="Es una prolongación filiforme de una neurona que transmite impulsos nerviosos hasta una o varias células musculares, glandulares o nerviosas.">Axón</button>
                <button class="rojo" data-info="Son componentes importantes en el desarrollo de circuitos neuronales funcionales. Estas ramas se establecen a través de una serie de procesos celulares que comienzan con el desarrollo de una red de actina F especializada en los axones.">Colateral del axón </button>
                <button class="rojo" data-info="Es una rama distal de un axón neuronal que se ramifica en terminales de los axones, y su función es transmitir señales a otras neuronas o células musculares y glandulares.">Telendron</button>
            </div>

            <div class="buttons-column">
                <button class="amarillo" data-info="Son estructuras filamentosas que se encuentran en el interior de las neuronas y se distribuyen a modo de red, penetrando en las prolongaciones dendríticas y en el axón. Tienen funciones de soporte neuronal y participan en el transporte de vesículas de neurosecreción.">Neurofibrillas </button>
                <button class="azul" data-info="Son prolongaciones cortas y ramificadas del soma de una neurona que se encargan de recibir impulsos nerviosos provenientes de otras neuronas. Estas estructuras son esenciales para la transmisión de información en el sistema nervioso, ya que permiten que las señales se propaguen de una neurona a otra a través de sinapsis.">Dendritas</button>
            </div>
        </div>

        <div class="image-right">
            <img src="https://imgs.search.brave.com/AGeg1ykStMhRt6v1T12zPj6kIrWyPwzaTHLBrdEyU5Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly91cGxv/YWQud2lraW1lZGlh/Lm9yZy93aWtpcGVk/aWEvY29tbW9ucy83/LzcwL05ldXJvbmEu/anBn" height="45%" width="45%" alt="La neurona">
            <!-- Contenedor para desplegar la información debajo de la imagen -->
            <div id="info-container"></div>
        </div>
    </div>
