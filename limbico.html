<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="limbico.css">
    <title>Limbico</title>
</head>
<body>
    <h1>LIMBICO</h1>
    <!-- Contenido principal: botones y imagen -->
    <div class="container-custom">
        <div class="buttons-group">
            <div class="buttons-column">
                <button class="morado" data-info="Conjunto de núcleos de neuronas localizados en la profundidad de los lóbulos temporales de los vertebrados complejos, incluidos los humanos.">Cuerpo amigdalino</button>
                <button class="morado2" data-info="Estructura cerebral fundamental que forma parte del sistema límbico, localizado en el lóbulo temporal. ">Hipocampo</button>
                <button class="verde" data-info="Es una región de materia gris cortical que rodea al hipocampo y es parte del sistema límbico, desempeñando un papel importante en la codificación y recuperación de la memoria.">Giro parahipocampal</button>
                <button class="verde" data-info="Es una circunvolución o gyrus en el área media del cerebro que cumple funciones determinantes en la actividad cerebral del sistema límbico; se encuentra hacia el borde o limbo de la corteza cerebral.">Giro cingulado</button>
                <button class="rojo" data-info="Es una pequeña glándula endocrina, Produce melatonina, una hormona derivada de la serotonina que afecta a la modulación de los patrones del sueño, tanto a los ritmos circadianos como estacionales.">Glandula pineal</button>
                <button class="rojo" data-info="El fórnix es esencial para la unión de los elementos del sistema límbico, participando en procesos cognitivos, consolidación de la memoria, emociones y respuesta sexual.">Fornix</button>
                <button class="rojo" data-info="Es una estructura de sustancia blanca que conecta los dos hemisferios cerebrales, permitiendo la transmisión e integración de información motora, sensorial y cognitiva entre ellos.">Cuerpo calloso</button>
            </div>

            <div class="buttons-column">
                <button class="amarillo" data-info="Es un grupo de núcleos cerebrales ubicados en la porción anterior del tálamo, juegan un papel en funciones relacionadas con la memoria, el aprendizaje y ciertas conductas emocionales.">Territorio anterior de los nucleos del talamo </button>
                <button class="azul" data-info="Es una estructura muy compleja que regula muchas reacciones químicas importantes del cerebro y es crucial para mantener varias funciones del organismo, incluyendo la regulación de la temperatura corporal, la frecuencia cardíaca, la sed, el hambre, los ciclos de sueño y la presión arterial.">Hipotalamo</button>
                <button class="azul2" data-info="Están involucradas en diversos procesos cognitivos y emocionales, siendo fundamentales para la memoria y el aprendizaje.">Cuerpos mamilar</button>
            </div>
        </div>

        <div class="image-right">
            <img src="https://imgs.search.brave.com/h2mpxVPUSj0a5BB5PtUHPqPTD0Uuznhqpr-kZ6EWO5Y/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbmZv/dGl0aS5jb20vd3At/Y29udGVudC91cGxv/YWRzL3Npc3RlbWEt/bGltYmljby5qcGc" height="80%" width="80%" alt="Limbico">
            <!-- Contenedor para desplegar la información debajo de la imagen -->
            <div id="info-container"></div>
        </div>
    </div>

    <div class="buttons-container">
      <a href="index.html"><button>Menu principal</button></a>
    </div>

</body>
